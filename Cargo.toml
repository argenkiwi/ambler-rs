[package]
name = "ambler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
futures = "0.3.34"
percent-encoding = "2.3.2"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "counter"
test = true

[[example]]
name = "m3ud"
test = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
